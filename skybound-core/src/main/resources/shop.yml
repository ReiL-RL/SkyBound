# ╔═══════════════════════════════════════════════════════════════╗
# ║         SkyBound Shop Configuration                           ║
# ║                                                               ║
# ║  Категории:                                                   ║
# ║    blocks       — строительные блоки                          ║
# ║    ores         — руды, металлы, минералы                     ║
# ║    farming      — урожай, семена, корма                       ║
# ║    food         — еда                                          ║
# ║    tools        — инструменты, оружие                         ║
# ║    armor        — броня                                       ║
# ║    redstone     — редстоун-механика                           ║
# ║    decoration   — декор и краски                              ║
# ║    brewing      — алхимия                                      ║
# ║    spawners     — спавн-яйца                                  ║
# ║    special      — редкие, сезонные                            ║
# ║                                                               ║
# ║  Поля предмета:                                               ║
# ║    display-name   — название с цветовыми кодами               ║
# ║    material       — bukkit Material                           ║
# ║    item           — сериализованный Bukkit ItemStack (опц.)   ║
# ║                     для предметов с meta/NBT вместо material  ║
# ║    buy-price      — цена покупки (0 = нельзя купить)         ║
# ║    sell-price     — цена продажи (0 = нельзя продать)         ║
# ║    default-amount — кол-во за один клик                       ║
# ║    slot           — слот в GUI категории                      ║
# ║    lore           — описание (с & цветами)                    ║
# ║    commands       — команды от консоли (опц.)                 ║
# ╚═══════════════════════════════════════════════════════════════╝

