# SkyBound Custom Recipes
# Supports shaped and shapeless recipes.
# Use material names from Bukkit Material enum.
# For custom items (future): use sop:item_id syntax.
#
# Этот файл регистрирует кастомные крафты при запуске плагина.
#
# Общая структура:
# recipes:
#   recipe_id:
#     type: shaped | shapeless
#     ...
#
# shaped-рецепт:
#   shape       — 1-3 строки по 1-3 символа. Пробел означает пустую ячейку.
#   ingredients — карта символ -> Bukkit Material.
#
# shapeless-рецепт:
#   ingredients — список Bukkit Material. Порядок в верстаке не важен.
#
# result:
#   material — Bukkit Material результата.
#   name     — кастомное имя результата, поддерживает & цвета.
#   amount   — количество результата. Автоматически clamp-ится к max stack size.
#   lore     — описание предмета.
#
# Некорректные материалы/формы пропускаются с warning в консоль.

recipes:
  island_key:
    type: shaped
    shape: [" D ", "DED", " D "]
    ingredients:
      D: DIAMOND
      E: EMERALD
    result:
      material: TRIPWIRE_HOOK
      name: "&6Ключ Острова"
      amount: 1
      lore:
        - "&7Открывает секретные сундуки"
        - "&7на вашем острове."

  compressed_cobble:
    type: shaped
    shape: ["CCC", "CCC", "CCC"]
    ingredients:
      C: COBBLESTONE
    result:
      material: STONE
      name: "&7Сжатый булыжник"
      amount: 1

  island_compass:
    type: shapeless
    ingredients:
      - COMPASS
      - ENDER_PEARL
      - GOLD_INGOT
    result:
      material: COMPASS
      name: "&bКомпас острова"
      amount: 1
      lore:
        - "&7Указывает путь домой."
