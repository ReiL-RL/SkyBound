# Доступные схематики островов
# Отображаются в GUI при создании острова (/is create)
#
# Каждый раздел внутри schematics — это отдельный тип стартового острова.
#
# Поля:
#   display-name — название кнопки в GUI. Поддерживает цветовые коды &.
#   icon         — Bukkit Material для иконки в GUI.
#   description  — lore/описание кнопки в GUI.
#   file         — имя файла в папке schematics/.
#
# Безопасность:
#   file не должен содержать путь вида ../ или абсолютный путь.
#   Плагин дополнительно нормализует имя файла и не даёт выйти из папки schematics.
#
# Как добавить новый остров:
#   1) положи файл .schem/.schematic в src/main/resources/schematics
#      или в plugins/SkyBound/schematics на сервере;
#   2) добавь новый ключ ниже;
#   3) укажи display-name/icon/description/file.

schematics:
  desert:
    display-name: "&e✦ Пустынный остров"
    icon: SAND
    description:
      - "&7Песчаный остров с кактусами"
      - "&7и пустынной атмосферой"
    file: desert.schem
  desert_nether:
    display-name: "&c✦ Пустынный Незер"
    icon: RED_SAND
    description:
      - "&7Пустынный остров"
      - "&7в стиле Незера"
    file: desert_nether.schem
  desert_end:
    display-name: "&5✦ Пустынный Энд"
    icon: END_STONE
    description:
      - "&7Пустынный остров"
      - "&7в стиле Энда"
    file: desert_end.schem
  jungle:
    display-name: "&a✦ Тропический остров"
    icon: JUNGLE_LOG
    description:
      - "&7Зелёный остров с джунглями"
      - "&7и тропической растительностью"
    file: jungle.schem
  jungle_nether:
    display-name: "&4✦ Тропический Незер"
    icon: CRIMSON_STEM
    description:
      - "&7Тропический остров"
      - "&7в стиле Незера"
    file: jungle_nether.schem
  jungle_end:
    display-name: "&d✦ Тропический Энд"
    icon: PURPUR_BLOCK
    description:
      - "&7Тропический остров"
      - "&7в стиле Энда"
    file: jungle_end.schem
  mushroom:
    display-name: "&d✦ Грибной остров"
    icon: RED_MUSHROOM_BLOCK
    description:
      - "&7Мистический остров с грибами"
      - "&7и мицелием"
    file: mushroom.schem
  mushroom_nether:
    display-name: "&6✦ Грибной Незер"
    icon: WARPED_STEM
    description:
      - "&7Грибной остров"
      - "&7в стиле Незера"
    file: mushroom_nether.schem
  mushroom_end:
    display-name: "&8✦ Грибной Энд"
    icon: CHORUS_FLOWER
    description:
      - "&7Грибной остров"
      - "&7в стиле Энда"
    file: mushroom_end.schem
