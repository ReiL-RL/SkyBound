# SkyBound Seasons Configuration
# Seasons are time periods with leaderboard rewards.
# When a season ends, top islands receive rewards.
#
# Сезоны работают по лидерборду ценности островов.
# Когда длительность сезона заканчивается:
#   1) берётся топ островов;
#   2) владельцам островов выдаются команды-награды из rewards;
#   3) при auto-reset-islands: true острова могут быть сброшены;
#   4) стартует новый сезон.
#
# Плейсхолдеры в командах:
#   {player} — владелец острова/получатель награды;
#   {rank}   — место в топе;
#   {island} — название острова;
#   {value}  — ценность острова;
#   {season} — номер сезона.
#
# Команды выполняются от консоли. Ведущий "/" писать не нужно.

seasons:
  # Включает сезонную систему.
  enabled: true
  # Длительность одного сезона в днях. Минимум 1.
  duration-days: 30
  # true — после завершения сезона автоматически регенерировать острова.
  # Осторожно: это destructive gameplay-действие для сервера.
  auto-reset-islands: false
  # Награды по месту. Ключ — rank, значение — список консольных команд.
  rewards:
    1: ["give {player} netherite_ingot 5", "say {player} занял 1 место!"]
    2: ["give {player} diamond 16"]
    3: ["give {player} gold_ingot 32"]
  # true — объявлять завершение сезона в чат сервера.
  announce-end: true
