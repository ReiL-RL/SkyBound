# SkyBound - Конфигурация бустеров
#
# Бустеры покупаются за деньги из банка острова и временно усиливают механику.
# Активные бустеры сохраняются и переживают рестарт сервера.
#
# Поля бустера:
#   display-name      — название в GUI, поддерживает & цвета.
#   description       — описание в GUI.
#   icon              — Bukkit Material иконки.
#   type              — тип бустера для API/аддонов.
#                       Доступные базовые типы: FARMING, EXPERIENCE, SPAWNER,
#                       GENERATOR, FLIGHT, ISLAND_XP, CUSTOM.
#   duration-seconds  — длительность в секундах. 600 = 10 минут.
#   cost              — цена активации, списывается из банка острова.
#   multiplier        — множитель эффекта. Для flight обычно 1.0,
#                       потому что важен сам факт активного бустера.

boosters:
  farming:
    display-name: "&aБустер фермерства"
    description: "&7Удваивает скорость роста растений"
    icon: WHEAT
    type: FARMING
    duration-seconds: 900
    cost: 12000.0
    multiplier: 1.75

  experience:
    display-name: "&bБустер опыта"
    description: "&7Удваивает получение опыта"
    icon: EXPERIENCE_BOTTLE
    type: EXPERIENCE
    duration-seconds: 900
    cost: 15000.0
    multiplier: 1.75

  spawner:
    display-name: "&cБустер спавнеров"
    description: "&7Удваивает скорость спавнеров"
    icon: SPAWNER
    type: SPAWNER
    duration-seconds: 600
    cost: 22000.0
    multiplier: 1.75

  generator:
    display-name: "&eБустер генератора"
    description: "&7Удваивает скорость генератора"
    icon: DIAMOND_ORE
    type: GENERATOR
    duration-seconds: 900
    cost: 18000.0
    multiplier: 1.75

  flight:
    display-name: "&fБустер полёта"
    description: "&7Включает полёт на 30 минут"
    icon: ELYTRA
    type: FLIGHT
    duration-seconds: 1800
    cost: 30000.0
    multiplier: 1.0

  island_xp:
    display-name: "&dБустер XP острова"
    description: "&7Удваивает получение XP острова"
    icon: NETHER_STAR
    type: ISLAND_XP
    duration-seconds: 900
    cost: 25000.0
    multiplier: 1.75
