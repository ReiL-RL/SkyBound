# SkyBound Generator Tiers Configuration
# Each tier has a required island level and ore distribution (material: weight).
#
# Генератор перехватывает образование COBBLESTONE/BASALT и заменяет блок
# на случайный материал из подходящего tier.
#
# Как выбирается tier:
#   required-level — минимальный уровень острова.
#   Чем выше уровень острова, тем более высокий tier может использоваться.
#
# distribution:
#   MATERIAL: weight
# Вес — это не процент, а относительный шанс.
# Например COBBLESTONE: 70 и IRON_ORE: 10 означает, что булыжник
# выпадет примерно в 7 раз чаще железной руды.
#
# Поля tier:
#   display-name    — имя уровня генератора в GUI/сообщениях.
#   icon            — Bukkit Material иконки.
#   required-level  — минимальный уровень острова.
#   distribution    — таблица материалов и весов.

tiers:
  basic:
    display-name: "&7Basic Generator"
    icon: COBBLESTONE
    required-level: 1
    distribution:
      COBBLESTONE: 70
      COAL_ORE: 20
      IRON_ORE: 10

  advanced:
    display-name: "&eAdvanced Generator"
    icon: IRON_ORE
    required-level: 5
    distribution:
      COBBLESTONE: 50
      COAL_ORE: 20
      IRON_ORE: 15
      GOLD_ORE: 10
      LAPIS_ORE: 5

  elite:
    display-name: "&bElite Generator"
    icon: DIAMOND_ORE
    required-level: 15
    distribution:
      COBBLESTONE: 30
      IRON_ORE: 20
      GOLD_ORE: 15
      DIAMOND_ORE: 10
      LAPIS_ORE: 10
      REDSTONE_ORE: 10
      EMERALD_ORE: 5

  legendary:
    display-name: "&6Legendary Generator"
    icon: EMERALD_ORE
    required-level: 30
    distribution:
      IRON_ORE: 20
      GOLD_ORE: 20
      DIAMOND_ORE: 20
      EMERALD_ORE: 15
      ANCIENT_DEBRIS: 5
      LAPIS_ORE: 10
      REDSTONE_ORE: 10
