# ╔═══════════════════════════════════════════════════════════════╗
# ║         SkyBound Prestige Shop                                ║
# ║                                                               ║
# ║  Токены престижа выдаются за каждый /is prestige.             ║
# ║                                                               ║
# ║  Поля предмета:                                               ║
# ║    material   — Material иконки в GUI                          ║
# ║    name       — название с цветовыми кодами (&)               ║
# ║    lore       — описание                                      ║
# ║    cost       — стоимость в токенах престижа                  ║
# ║    rewards    — список выдаваемых предметов (строится через    ║
# ║                 Bukkit API, поэтому работает на любой версии). ║
# ║    commands   — (опц.) консольные команды, {player} → ник.    ║
# ║                                                               ║
# ║  Поля одной награды (rewards):                                ║
# ║    material      — Material предмета                           ║
# ║    amount        — количество                                 ║
# ║    enchantments  — список "ключ:уровень" (напр. sharpness:5)   ║
# ║    spawner       — тип моба для SPAWNER (напр. ZOMBIE)         ║
# ║    flight        — дальность полёта для FIREWORK_ROCKET        ║
# ║                                                               ║
# ║  Если предметы не влезают в инвентарь — выпадают под ноги.    ║
# ╚═══════════════════════════════════════════════════════════════╝

