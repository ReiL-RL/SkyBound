# SkyBound - Конфигурация улучшений
#
# Улучшения покупаются из банка острова через GUI улучшений.
# У каждого улучшения есть уровни, цена и value — значение эффекта.
#
# Общая структура:
# upgrades:
#   upgrade_id:
#     display-name: "..."
#     icon: MATERIAL
#     type: UPGRADE_TYPE
#     levels:
#       1: { cost: цена, value: эффект }
#
# Поля:
#   display-name — название в меню, поддерживает & цвета.
#   icon         — Bukkit Material иконки.
#   type         — тип улучшения. Код использует его для некоторых эффектов.
#   levels       — уровни улучшения. Покупаются строго по порядку.
#   cost         — цена уровня, списывается из банка острова.
#   value        — эффект уровня:
#                  ISLAND_SIZE    -> бонус к радиусу острова;
#                  TEAM_SIZE      -> бонус к лимиту участников;
#                  BANK_CAPACITY  -> бонус к лимиту банка;
#                  ENTITY_LIMIT   -> бонус к лимиту существ;
#                  остальные типы доступны для аддонов/будущих механик.

upgrades:
  island_size:
    display-name: "&aРазмер острова"
    icon: GRASS_BLOCK
    type: ISLAND_SIZE
    levels:
      1: { cost: 15000, value: 10 }
      2: { cost: 45000, value: 20 }
      3: { cost: 110000, value: 35 }
      4: { cost: 240000, value: 50 }
      5: { cost: 500000, value: 75 }

