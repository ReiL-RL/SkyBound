# ================================================================
# SkyBound plugin descriptor
# ================================================================
# Этот файл читает Bukkit/Paper при запуске сервера.
# Здесь объявляются:
#   - главный Java-класс плагина;
#   - поддерживаемая версия API;
#   - зависимости/softdepend;
#   - команды, которые Bukkit должен зарегистрировать;
#   - глобальные permissions.
#
# Важно:
#   * main должен указывать на класс, который extends JavaPlugin.
#   * api-version влияет на режим совместимости Bukkit API.
#   * softdepend не является обязательной зависимостью: если плагина нет,
#     SkyBound запустится и отключит связанную интеграцию.
#   * commands — только регистрация команд. Логика subcommands находится в коде.
#   * permissions здесь глобальные Bukkit-права. Права внутри острова
#     настраиваются отдельно через IslandPermissionManager/GUI ролей.

name: SkyBound
version: ${project.version}
main: me.reil.skybound.core.SkyBoundPlugin
api-version: 1.16
author: Reil
description: Modular SkyBlock core with addon architecture

# Мягкие зависимости:
# Vault — экономика.
# PlaceholderAPI — плейсхолдеры.
# WorldEdit/FastAsyncWorldEdit — вставка schematic.
# SopLib — опциональная совместимость/утилиты через reflection.
# VoidRift — внешний addon/hook.
# FlexAchievements — внешний hook достижений.
# SkyBound-IslandCore — addon ядер острова.
# Required runtime dependency:
# SopLib is the version-core used by SkyBound.
depend: [SopLib]
softdepend: [Vault, PlaceholderAPI, WorldEdit, FastAsyncWorldEdit, VoidRift, FlexAchievements, SkyBound-IslandCore]

# Команды:
# /is — основная команда игроков. Внутри есть create/home/team/shop/missions/etc.
# /sbadmin — административные команды, например управление токенами престижа.
commands:
  is:
    description: Main island command
    usage: /is [subcommand]
    aliases: [island, sb]
  sbadmin:
    description: SkyBound admin command
    usage: /sbadmin [subcommand]
    aliases: [skyadmin]

# Глобальные permissions Bukkit.
# default:
#   true  — доступно всем игрокам;
#   op    — только операторам сервера;
#   false — нужно выдавать через permissions-плагин.
permissions:
  skybound.admin:
    description: Full admin access
    default: op
  skybound.admin.bypass:
    description: Bypass island protection
    default: op
  skybound.island.create:
    description: Create an island
    default: true
  skybound.island.home:
    description: Teleport to island
    default: true
  skybound.island.invite:
    description: Invite players
    default: true
